<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otherside — Operational Masterplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://otherside-masterplan-preview.surge.sh/styles.css">
<style>
/* Change 1 — "Done" column on department strategy tables */
.dtr{grid-template-columns:1.4fr 1.6fr .8fr .8fr 1.4fr 76px 30px !important}
.dtc{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--line)}
.dtc input{width:17px;height:17px;cursor:pointer;accent-color:var(--done)}
.dtr.done .dtd{text-decoration:line-through;color:var(--mut2);opacity:.7}
</style>
</head>
<body>
<header>
  <div class="brand"><svg class="logomark" viewBox="0 0 60 56" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="23" r="13" stroke="var(--gold2)" stroke-width="2"/><line x1="3" y1="29" x2="57" y2="29" stroke="var(--gold2)" stroke-width="2" stroke-linecap="round"/><rect x="15" y="34" width="30" height="2.6" rx="1.3" fill="#F5831F"/><rect x="19" y="39" width="22" height="2.6" rx="1.3" fill="#F5831F"/><rect x="23" y="44" width="14" height="2.6" rx="1.3" fill="#F5831F"/><rect x="27" y="49" width="6" height="2.6" rx="1.3" fill="#F5831F"/></svg><span class="wm">OTHERSIDE</span><span class="brandsub">Operational Masterplan</span></div>
  <div class="grow"></div>
  <div class="who"><span>You:</span><input id="nameIn" placeholder="your name" autocomplete="off"></div>
  <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">connecting…</span></div>
</header>
<nav id="tabs"></nav>
<div class="wrap">
  <main id="main"><div class="empty" style="padding:30px">Loading masterplan…</div></main>
  <aside>
    <div class="feedbar"><div class="aside-h">Activity &amp; Memory</div><button id="feedToggle" class="feedtoggle" onclick="toggleFeed()" title="Collapse">&raquo;</button></div>
    <div class="aside-sub">Every edit, status change &amp; comment — shared with everyone.</div>
    <div class="feed" id="feed"><div class="empty">Loading…</div></div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script src="https://otherside-masterplan-preview.surge.sh/app.js"></script>
<script src="https://otherside-masterplan-preview.surge.sh/app2.js"></script>
<script src="https://otherside-masterplan-preview.surge.sh/app3.js"></script>
<script src="https://otherside-masterplan-preview.surge.sh/app4.js"></script>
<script>
/* ===== Otherside OMP — patches applied over the shared app + Supabase =====
   Change 2: the Proposed reframe IS the Overview (single source, team-editable).
   Change 1: a "Done" checkbox on every department strategy row (strikethrough + persists). */
(function(){
  // Remove the separate "Proposed" tab — Overview now shows the reframed plan.
  try{var tb=document.getElementById('tabs');Array.prototype.slice.call(tb.children).forEach(function(b){if(b.dataset&&b.dataset.id==='proposed')b.remove();});}catch(e){}

  // Everything runs on the reframed (p_*) dataset.
  window.renderMain=function(){
    EDITING=false; NS='prop';
    document.body.classList.toggle('ov', CURRENT==='overview');
    if(CURRENT==='departments') return renderDepartments();
    return renderOverview();
  };

  // De-"staging" the framing copy now that it's the real plan.
  var _framing=window.framingStrips;
  window.framingStrips=function(){
    var h=_framing();
    h=h.replace('PROPOSED v2 &middot; STAGING','THE 2026 PLAN');
    h=h.replace('An editable copy of the live plan, reframed around Adeyemi&rsquo;s review (28 Jun). Edits here do <b>not</b> touch the live Overview - the hierarchy below is the same one, copied.','The operating masterplan for 2026 — five operating principles, the targets and sequence, and how every department ladders to the number. Everything is editable and shared with the team.');
    h=h.replace('The live hierarchy, copied. Targets reset to Adeyemi&rsquo;s numbers and a new <b>Brand &amp; Content</b> lane added (P5). Click any cell, title or department to edit this staging copy.','Each pillar feeds the number and breaks down into who owns what across Strategy, Operations, Marketing, Brand &amp; Content, Delivery and Metrics. Click any cell, title or department to edit.');
    return h;
  };

  // Change 1: department strategy table with a "Done" column.
  window.renderDept=function(id){
    var d=dDepts().find(function(x){return x.id===id;}); if(!d){DEPT=null;return renderDepartments();}
    var rows=dDrows().filter(function(r){return r.dept_id===id;});
    var h='<div class="deptpage">';
    h+='<div class="crumbbar"><div class="crumb"><a onclick="goOverview()">Overview</a><span class="sep">&rsaquo;</span><a onclick="backDepts()">Departments</a><span class="sep">&rsaquo;</span><span class="cur">'+esc(d.name)+'</span></div><div class="crumbtools"><button class="backbtn deldept" onclick="delDept(\''+id+'\')">Delete</button></div></div>';
    h+='<div class="depthead"><span id="dh-'+id+'" onclick="editDeptName(\''+id+'\')">'+esc(d.name)+'</span> Department</div>';
    h+=ladderBlock(d);
    h+=secBlock(id,'services','Services provided to the business');
    h+=secBlock(id,'goals','Strategic Goals and Objectives');
    h+='<div class="dept2col">'+secBlock(id,'kpis','Reportable KPIs')+secBlock(id,'resources','Resources')+'</div>';
    h+='<div class="sech">Strategy table</div>';
    h+='<div class="dtable"><div class="dtr dthead"><div>Strategy</div><div>Activity</div><div>Owner</div><div>Target Date</div><div>KPI</div><div>Done</div><div></div></div>';
    rows.forEach(function(r){
      h+='<div class="dtr'+(r.complete?' done':'')+'">'+dcell(r.id,'strategy')+dcell(r.id,'activity')+dcell(r.id,'owner')+dcell(r.id,'target_date')+dcell(r.id,'kpi')+
      '<div class="dtc"><input type="checkbox"'+(r.complete?' checked':'')+' onclick="toggleDeptRowDone(\''+r.id+'\',this.checked)" title="Mark complete"></div>'+
      '<div class="dtx" onclick="delDeptRow(\''+r.id+'\')" title="Delete row">&times;</div></div>';
    });
    if(!rows.length)h+='<div class="dtr"><div class="dtd" style="grid-column:1/8"><span class="dempty">No rows yet - add one below.</span></div></div>';
    h+='</div>';
    h+='<button class="addrow" onclick="addDeptRow(\''+id+'\')">+ Add strategy row</button>';
    h+='</div>';
    document.getElementById('main').innerHTML=h;
  };

  window.toggleDeptRowDone=async function(rowId,val){
    var r=dDrows().find(function(x){return x.id===rowId;});
    await updateRow(tbl('dept_rows'),rowId,{complete:val,updated_by:me(),updated_at:new Date().toISOString()});
    await logAct({area:'departments',kind:'status',summary:'Strategy row marked '+(val?'complete':'incomplete'),tbl:tbl('dept_rows'),row_id:rowId,field:'complete',prev:(r?String(r.complete):'false')});
    await load();
  };

  // Re-render with patches applied.
  try{ CURRENT='overview'; renderTabs(); load(); }catch(e){}
})();
</script>
</body>
</html>
